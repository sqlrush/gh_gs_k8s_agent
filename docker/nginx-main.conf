# 大盘前端的 nginx 主配置(1.5.0 起随镜像发出,覆盖基础镜像自带的 /etc/nginx/nginx.conf)。
# 与 nginxinc/nginx-unprivileged:1.27-alpine 自带的相同,只把 worker_processes 从 auto 改成 2:
# auto 按节点 CPU 数起进程,鲲鹏 160 核 + 64K 页内核下起 160 个,超出容器 128Mi 上限被 OOM 杀(2026-11-17 实测)。
# 这个容器只端静态页面,2 个进程绰绰有余。server 段在 nginx-dash.conf(conf.d/default.conf)。
worker_processes  2;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;


events {
    worker_connections  1024;
}


http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
