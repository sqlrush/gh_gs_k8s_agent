# 全体用户 Pod 共用的非密配置(各项含义见 docs/从源码构建到K8s运行-完整手册.md 5.5)。样例值;平台按实际填写。
# Mac 验证时 scripts/k8s/verify-cluster.sh 会用 kubectl 覆盖成 host.docker.internal:8781。
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: gaussdb-agent
data:
  GRMP_API_HOST: grmp.example.internal
  GRMP_API_PORT: "8080"
  # **必填。** 中间件接口的路径前缀,由中间件团队提供(形如 /xxx/grmp/diagnostic/agent,以 / 开头,只写路径)。
  # 技能请求 <前缀>/common-operations 与 <前缀>/common-operations/invoke。留空时登录数据库直接报「GRMP_PATH_PREFIX 没配」。
  GRMP_PATH_PREFIX: ""
  # 2026-09-18 中间件加固:请求头带 Appkey / Timestamp / Signature。GRMP_APPKEY 为空 = 不签名。
  # 私钥在 Secret grmp-sm2。下面四个旋钮按中间件口径填,缺省 = 国标 / Java BouncyCastle 常见形态;
  # 注意 OpenSSL 签出来的默认 userId 是空串,客户用什么必须问清。
  # 过渡期(私钥还没到位):先只发 Appkey + Timestamp,不发 Signature。
  #   过渡期填:GRMP_APPKEY: <中间件给的 Appkey> / GRMP_SIGN_MODE: headers-only / GRMP_SIGN_TIMESTAMP: s
  #   密钥到位后:GRMP_SIGN_MODE 改回 full,并建 Secret grmp-sm2。
  # headers-only 时不读私钥,平台不必挂一个用不上的 Secret;full 时拿不到私钥会直接报错,
  # **不会因为拿不到私钥就自动降级**——降级必须是这里写明的决定。
  GRMP_APPKEY: ""
  GRMP_SIGN_MODE: full
  GRMP_SIGN_USER_ID: "1234567812345678"
  GRMP_SIGN_TIMESTAMP: ms
  GRMP_SIGN_FORMAT: raw
  GRMP_SIGN_ENCODING: hex
  GRMP_SIGN_PAYLOAD: "{path}+{timestamp}"
  # 2026-09-20 客户确认中间件要显式收调用人工号。工号取自 GSDB_USER_ID(模板按 Pod 注入),
  # 这里只说放哪儿:请求头名 / 报文顶层键名,按客户给的字段填,两个都留空 = 不发工号。
  # 填了字段名而 GSDB_USER_ID 为空时,建连接就报错——不会悄悄发一个空工号。
  GRMP_USER_ID_HEADER: ""
  GRMP_USER_ID_PARAM: ""
  # 实例别名:用户说「核心库」时智能体能直接登录,不用反问是哪个库。每项 `别名=实例IP/库名  # 说明`,
  # 换行或分号分隔;login --list 只给模型看别名、库名与说明(不显示 IP)。写错的项不影响 Pod 启动,会在 --list 里提示。
  GRMP_INSTANCE_ALIASES: ""
  MODEL_BASE_URL: http://llm.example.internal/v1
  MODEL_ID: qwen3-32b
  MODEL_PROVIDER_NAME: model-service
  # 模型能接收的输入,逗号分隔:text,image(可选还有 audio / video / pdf)。不写 = 纯文本。
  # 知识库导入要读照片 / 截图时必须含 image,否则 read 报「this model does not support image input」。
  # 只在模型服务确实支持图片时才开:纯文本模型开了,发图那一轮模型服务会报错。
  MODEL_INPUT_MODALITIES: ""
  # 回答里「打开报告」链接的站点前缀。技能给出的链接是 <前缀>/dash/<页面>?<参数>(页面与参数见
  # docs/前端对接接口说明.md 第 7 章)。留空 = 根相对地址 /dash/...,大盘与对话页同源时点开就对;
  # 大盘在别的站点(贵方门户)时填那个站点,例如 https://portal.example.com。改了要重启用户 Pod 才生效。
  GSDB_DASH_BASE_URL: ""
