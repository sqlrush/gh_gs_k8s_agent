# 样例。平台用 kubectl create secret 创建真实的,**不要**把密钥提交进版本库。
#
#   TRUST_SECRET   与上游 SSO / WAF 约定的共享密钥。上游在 `X-Agent-Trust` 头里带上,
#                  网关用常数时间比较。**这是整个网关的安全边界**:谁能把工号头发进来,
#                  谁就能进任何人的环境。至少 16 字符。
#   ADMIN_TOKEN    控制 API(/admin/...)的密钥,给客户自己的容器管理框架调用。
#                  **留空 = 控制 API 整个关闭**(连「需要鉴权」都不回,直接 404)。
#                  只用代理入口的客户不需要它。
#
# TRUST_SECRET 与 ConfigMap 里的 TRUST_CIDRS **不能都为空** —— 都空时网关拒绝启动,
# 因为那样它就是个「任填工号即可进入任何人环境」的接口,而且从外面看不出异常。
#
#   kubectl -n gaussdb-agent create secret generic gateway-auth \
#     --from-literal=TRUST_SECRET="$(openssl rand -hex 24)" \
#     --from-literal=ADMIN_TOKEN="$(openssl rand -hex 24)"
#
# 轮换 TRUST_SECRET 要与上游同时改,否则所有用户会在改完的那一刻全部 403。
apiVersion: v1
kind: Secret
metadata:
  name: gateway-auth
  namespace: gaussdb-agent
type: Opaque
stringData:
  TRUST_SECRET: "CHANGE-ME-至少16字符的随机串"
  ADMIN_TOKEN: ""
