# 样例,不要直接 apply。固定池化的控制密钥(GATEWAY_RUNTIME_MODE=pool 时才需要):网关调各 Pod 管家的
# 4098 控制接口时用它给请求签名、给 GRMP 令牌加密,管家用它验签、解密、给应答签名。
# 只注入网关与管家(k8s/tools/render-pool.py 渲染的 steward 容器),槽位容器里没有。至少 16 个字符。
#   kubectl -n gaussdb-agent create secret generic sandbox-control --from-literal=KEY="$(openssl rand -hex 32)"
# 轮换:改 Secret → 重启网关 → 逐个删池子 Pod 重建(StatefulSet 是 OnDelete;删 Pod 时在用的人先完整写回)。
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-control
  namespace: gaussdb-agent
type: Opaque
stringData:
  KEY: "<至少 16 个字符的随机串,由平台生成>"
