# NAS 的静态 PV 样例 —— **NFS 地址写在这里，不在 nas-pvc.yaml 里。**
#
# K8s 的存储分申请与供给两边:
#   nas-pvc.yaml  申请:「我要一个 500Gi 的 RWX 卷」——我方提供,一般不用改
#   本文件        供给:「这个卷是哪台 NFS 的哪个目录」——**客户按实际填**
#
# 两种情形,只需要走一条:
#   ① 集群已有 RWX 的 StorageClass(装了 NFS provisioner)
#      → 不需要本文件。把 nas-pvc.yaml 的 storageClassName 改成贵方那个类名即可,卷会自动创建。
#   ② 集群没有
#      → 复制本文件去掉 .example,填上 server 与 path,**先 apply 它**,再 apply base。
#
# 本文件刻意不在 kustomization.yaml 里:情形 ① 的客户 apply 它只会多出一个用不上的 PV,
# 而一个 storageClassName 相同、容量相同的闲置 PV 会把 PVC 绑到错的地方去。
#
# 另外三件事,漏了会以「能对话但历史全丢」的形态出现,而当时没有任何报错:
#   · 导出目录下要预先建好 users/、admins/、kb/ 三个子目录
#   · 这三个目录的属主 uid/gid 都是 1000(容器以非 root 的 uid 1000 运行)
#   · mountOptions 里的 local_lock=all 不能省 —— 容器用文件锁做「同一目录不被两个
#     容器同时写」的独占标记,NFS 服务端锁在部分实现上不可靠
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nas-nfs
spec:
  capacity:
    storage: 500Gi                   # 与 nas-pvc.yaml 的 requests 保持一致
  accessModes: [ReadWriteMany]       # 必须是 RWX:多个用户容器同时挂同一个卷
  persistentVolumeReclaimPolicy: Retain   # **不要改成 Delete** —— 那是用户的会话与知识库
  storageClassName: nas              # 与 nas-pvc.yaml 的 storageClassName 一致
  mountOptions: [nfsvers=4.1, hard, local_lock=all]
  nfs:
    server: <NFS 服务器地址>
    path: <NFS 导出路径>             # 例如 /export/gaussdb-agent
