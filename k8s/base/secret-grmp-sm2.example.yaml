# 样例,不要直接 apply。2026-09-18 中间件加固:GRMP 请求头要带 Appkey / Timestamp / Signature,
# Signature 是该 Appkey 的 SM2 私钥签名。密钥对由客户中间件方按 Appkey 签发,整个智能体一把,
# 所有 runtime Pod 共用(kb-import 不调中间件,不需要)。平台用:
#   kubectl -n gaussdb-agent create secret generic grmp-sm2 --from-file=GRMP_SM2_PRIVATE_KEY=<私钥文件>
# 私钥文件内容:64 位十六进制,或 PEM(PKCS#8 / EC PRIVATE KEY)。Appkey 与签名旋钮放 agent-config。
apiVersion: v1
kind: Secret
metadata:
  name: grmp-sm2
  namespace: gaussdb-agent
type: Opaque
stringData:
  GRMP_SM2_PRIVATE_KEY: "<SM2 私钥,由客户签发,平台填写>"
