# SQL 取自 common/sql.py 的 skill_sqlreview_002。
#
# 原注释保留其意：indkey 是 int2vector。openGauss 基于 PostgreSQL 9.2，
# 没有 WITH ORDINALITY（9.4+），用 generate_series 展开向量以保住列顺序。
# 表达式索引的列（attnum 0）会被 JOIN 掉。
#
# **改动一：%s 绑定变量换成 {{schema}}，并手工补上引号**（同 tables.yaml）。
# **改动二：列数组外面套了 array_to_string(..., ',')**，括号内一字未动。
#   理由与 tables.yaml 相同：数组的字符串化形式协议未定义，让数据库直接
#   吐文本是唯一在直连/本机中间件/现场中间件三边都稳定的形式。
#
# 七个列名原本就唯一且有意义，未加别名。
# is_unique / is_primary 是布尔列，取回来是 't'/'f'，调用方用 _as_bool 判断。
# M 兼容(v1.5.1,2026-11-20 现场反馈):本脚本切到业务库执行,业务库可能是 M 兼容模式(sql_compatibility='M')。
#   同 tables.yaml:AS table → AS "table"。列顺序不再靠数组下标 (string_to_array(…))[s] 与 generate_series 展开(M 库
#   能否用没有把握),改成在 indkey 的文本形态 ' 3 1 2 ' 里找 ' <attnum> ' 的位置排序:position(… IN …) 是两种模式都有的标准写法
#   (M 库保持原 GaussDB 行为,官方文档「系统函数兼容性概述」)。表达式列 attnum 为 0,被 attnum > 0 排除,与原口径相同;
#   同一列在索引里出现两次时只列一次(极少见)。
# 输出类型(v1.5.2,2026-11-25 现场反馈):业务库可能是 M 兼容模式,中间件按 JDBC 类型映射取值再转成文字,布尔列在那里
#   变成 Java 字节数组 [B@…、原值丢失。输出列一律收口到《M-Compatibility 开发指南》JDBC 映射表里取出来就是文字 / 整数 /
#   小数的类型:布尔 → CASE WHEN … THEN 1 ELSE 0 END,名字类(name)与 "char" → ::text,表达式列都写别名;列名不变。
#   守卫:test_registry_output_types_units.py(类型清单 tests/fixtures/registry_output_types.json)。
name: sqlreview.indexes
database_type: appbusiness
description: 某模式下的索引清单（列顺序/唯一性/扫描次数）
sql: |
  SELECT
    n.nspname::text                                              AS schema,
    t.relname::text                                              AS "table",
    i.relname::text                                              AS name,
    COALESCE((SELECT array_to_string(array_agg(a.attname::text
                       ORDER BY position(concat(' ', a.attnum::text, ' ') IN concat(' ', ix.indkey::text, ' '))), ',')
                FROM pg_attribute a
               WHERE a.attrelid = t.oid AND a.attnum > 0
                 AND position(concat(' ', a.attnum::text, ' ') IN concat(' ', ix.indkey::text, ' ')) > 0), '') AS columns,
    CASE WHEN ix.indisunique THEN 1 ELSE 0 END                   AS is_unique,
    CASE WHEN ix.indisprimary THEN 1 ELSE 0 END                  AS is_primary,
    COALESCE(s.idx_scan, 0)                                      AS scans
  FROM pg_index ix
  JOIN pg_class i     ON i.oid = ix.indexrelid
  JOIN pg_class t     ON t.oid = ix.indrelid
  JOIN pg_namespace n ON n.oid = t.relnamespace
  LEFT JOIN pg_stat_user_indexes s ON s.indexrelid = ix.indexrelid
  WHERE n.nspname = '{{schema}}'
  ORDER BY t.relname, i.relname;
params:
  - key: schema
    type: String
    description: 模式名
