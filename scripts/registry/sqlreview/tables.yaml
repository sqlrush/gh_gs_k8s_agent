# SQL 取自 common/sql.py 的 skill_sqlreview_001。
#
# **改动一：%s 绑定变量换成 {{schema}}，并手工补上引号。**
#   绑定变量下驱动会替字符串加引号，原文写的是 `n.nspname = %s`；换成文本
#   替换后引号责任回到脚本作者身上，不补就渲染成 `= public`（被当成列名）。
#   参数是 String 类型，注册时会标 STRING_PARAM —— 类型校验对它无效。
#   防线在调用方：取值是命令行 --schema 的原值。
#
# **改动二：两个数组表达式外面套了 array_to_string(..., ',')。**
#   括号内一字未动，只是把 text[] 投影成逗号分隔文本。
#   理由：协议规定所有列值都是字符串，而**数组的字符串化形式协议没有定义**，
#   完全取决于中间件实现。实测本机（当时是 pg8000 + serialize）给的是 Python 的
#   列表 repr `"['id', 'k', 'payload']"`，调用方 objects.py 的 _as_tuple
#   会把它切成 ["['id'", " 'k'", " 'payload']"] —— 一堆带引号的垃圾列名，
#   **不报错**，只是让命名规范类规则给出整片误报。现场中间件是另一套实现，
#   只会得到第三种形态。让数据库直接吐文本是唯一在三边都稳定的形式。
#   代价：列名/约束名里若含逗号（须双引号标识符，极罕见）会被多切一刀。
#
# 列名 schema/table/has_pk/fks/columns 原本就唯一且有意义，未加别名。
# has_pk 是布尔列，取回来是 't'/'f'（或 'true'/'false'，取决于中间件的
# 布尔渲染），调用方必须用 _as_bool 判断 —— bool('f') 是 True。
# M 兼容(v1.5.1,2026-11-20 现场反馈):本脚本切到业务库执行,业务库可能是 M 兼容模式(sql_compatibility='M')。
#   TABLE 在 M 库是保留字,`AS table` 报 syntax error:别名改成 AS "table"(M 库里双引号别名按字符串别名处理,A 库是加引号的标识符,
#   两边列名都是 table)。顺带去掉 ARRAY[]::text[] 字面量:COALESCE 挪到 array_to_string 外面,空集仍得 ''。
# 输出类型(v1.5.2,2026-11-25 现场反馈):业务库可能是 M 兼容模式,中间件按 JDBC 类型映射取值再转成文字,布尔列在那里
#   变成 Java 字节数组 [B@…、原值丢失。输出列一律收口到《M-Compatibility 开发指南》JDBC 映射表里取出来就是文字 / 整数 /
#   小数的类型:布尔 → CASE WHEN … THEN 1 ELSE 0 END,名字类(name)与 "char" → ::text,表达式列都写别名;列名不变。
#   守卫:test_registry_output_types_units.py(类型清单 tests/fixtures/registry_output_types.json)。
name: sqlreview.tables
database_type: appbusiness
description: 某模式下的表清单（主键/外键/列名）
sql: |
  SELECT
    n.nspname::text                                              AS schema,
    c.relname::text                                              AS "table",
    CASE WHEN EXISTS (SELECT 1 FROM pg_constraint pk
                      WHERE pk.conrelid = c.oid AND pk.contype = 'p')
         THEN 1 ELSE 0 END                                       AS has_pk,
    COALESCE((SELECT array_to_string(array_agg(fk.conname::text), ',')
                FROM pg_constraint fk
               WHERE fk.conrelid = c.oid AND fk.contype = 'f'), '') AS fks,
    COALESCE((SELECT array_to_string(array_agg(a.attname::text ORDER BY a.attnum), ',')
                FROM pg_attribute a
               WHERE a.attrelid = c.oid AND a.attnum > 0 AND NOT a.attisdropped), '') AS columns
  FROM pg_class c
  JOIN pg_namespace n ON n.oid = c.relnamespace
  WHERE c.relkind = 'r' AND n.nspname = '{{schema}}'
  ORDER BY c.relname;
params:
  - key: schema
    type: String
    description: 模式名
