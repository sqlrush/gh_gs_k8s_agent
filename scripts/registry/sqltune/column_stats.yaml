# SQL 取自 common/sql.py 的 skill_sqltune_003。
#
# 六列全是普通列引用，列名本来就唯一且有意义，**一个别名都没加**。
# 唯一改动是 `IN {names}` 写成 `IN ({{names}})`，同 sqltune.tables。
#
# 注意 correlation 允许为 NULL：协议把 NULL 渲染成空串（与真空串不可区分），
# 取值代码要把空串当 None 处理，不能直接 float()。
name: sqltune.column_stats
description: SQL 涉及的表的列统计信息（证据包 ## Column Statistics）
sql: |
  SELECT schemaname, tablename, attname, n_distinct, null_frac, avg_width, correlation,
         COALESCE(most_common_vals::text, '') AS most_common_vals,
         COALESCE(most_common_freqs::text, '') AS most_common_freqs,
         COALESCE(histogram_bounds::text, '') AS histogram_bounds
  FROM pg_stats
  WHERE tablename IN ({{names}});
params:
  - key: names
    type: String
    description: 带引号的表名字面量列表，如 'orders','items'。取值必须来自调用方已校验的标识符，不可直接取用户输入
