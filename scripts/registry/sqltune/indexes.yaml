# SQL 取自 common/sql.py 的 skill_sqltune_002。
#
# **改动一（必须）：t.relname 与 i.relname 两列重名。** 协议按列名做键，
# 后一个（索引名）会静默覆盖前一个（表名），证据包的 ## Indexes 一节会变成
# 「索引名 + 索引名」，不报错也不告警。分别加别名 table_name / index_name。
#
# **改动二：pg_get_indexdef(...) 原列名是 pg_get_indexdef（函数名）。**
# 不重名但作为 JSON 键没有意义，加别名 index_def。
# indisunique / indisprimary 本来就唯一且有意义，未动。
#
# **改动三：`IN {names}` 写成 `IN ({{names}})`**，同 sqltune.tables。
#
# 注意布尔列：协议把布尔渲染成 t/f（或 true/false）字符串，bool("f") 是 True，
# 取值代码必须按字符串判断，不能直接 bool()。
# **改动四：补 index_relpages / index_reltuples（代价推演的输入）。**
# 索引扫描的代价里有两块要用索引自身的规模：树高（≈ log(条目数)/log(扇出)，
# 决定每次探测的随机 IO 次数）与按选择率折算的索引页数。取自 pg_class 里
# **索引那一行**（i.relpages/i.reltuples），不是表那一行 —— 两者差着数量级，
# 取错了算出来的树高会小得离谱，而结果依然是个像模像样的数字。
name: sqltune.indexes
description: SQL 涉及的表上已有的索引（证据包 ## Indexes）
sql: |
  SELECT n.nspname AS schema_name, t.relname AS table_name,
         i.relname AS index_name,
         ix.indisunique,
         ix.indisprimary,
         i.relpages AS index_relpages,
         i.reltuples::bigint AS index_reltuples,
         pg_get_indexdef(ix.indexrelid) AS index_def
  FROM pg_class t
  JOIN pg_index ix ON t.oid = ix.indrelid
  JOIN pg_class i ON i.oid = ix.indexrelid
  JOIN pg_namespace n ON n.oid = t.relnamespace
  WHERE t.relname IN ({{names}});
params:
  - key: names
    type: String
    description: 带引号的表名字面量列表，如 'orders','items'。取值必须来自调用方已校验的标识符，不可直接取用户输入
