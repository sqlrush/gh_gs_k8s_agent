# 过程「找不到」时的排查脚本之三:按名字模糊搜过程与包。
# 两个 LEFT JOIN 是有意的:对象隔离下 pg_namespace 行被藏、pg_proc 行还在(og5 实测),内联 JOIN 会把它丢掉;
# LEFT JOIN 让它以 nspname 为空的形态回来——这就是「过程在、schema 不可见」的证据。
# 包那半段只在给了包名时才搜(A 兼容库 '' 即 NULL,所以用 length 判空而不是 <> '')。
# {{name}} / {{package}} 进的是 LIKE 的引号里,调用方(common/procname.py)只放行合法标识符。
# M 兼容(v1.5.1,2026-11-20 现场反馈):本脚本切到业务库执行,业务库可能是 M 兼容模式(sql_compatibility='M')。
#   M 库不支持 ILIKE(syntax error at or near "ILIKE"):改成 lower(…) LIKE lower(…),两种模式都不分大小写。
#   名字列进 COALESCE / UNION 前先 ::text(两个分支的列类型一致,不靠 M 库的类型推导)。
#   length('') 在 A 库是 NULL、M 库是 0,COALESCE 后都不 > 0,判空写法两边一致;M 库升序默认 NULLS LAST,与 A 库相同。
name: procinfo.locate_search
database_type: appbusiness
description: 过程找不到时的排查:按名字模糊搜过程(schema 不可见时 nspname 为空)与包
sql: |
  SELECT 'proc' AS kind, n.nspname::text AS nspname, COALESCE(k.pkgname::text, '') AS pkgname, p.proname::text AS proname
  FROM pg_proc p
  LEFT JOIN pg_namespace n ON n.oid = p.pronamespace
  LEFT JOIN gs_package k ON k.oid = p.propackageid
  WHERE lower(p.proname::text) LIKE lower('%{{name}}%')
    AND (n.nspname IS NULL OR (n.nspname NOT LIKE 'pg_%' AND n.nspname NOT LIKE 'dbe_%'
         AND n.nspname NOT IN ('information_schema', 'pkg_service', 'pkg_util', 'sqladvisor', 'db4ai',
                               'snapshot', 'blockchain', 'cstore', 'pmk', 'coverage')))
  UNION ALL
  SELECT 'package' AS kind, n.nspname::text AS nspname, k.pkgname::text AS pkgname, '' AS proname
  FROM gs_package k
  LEFT JOIN pg_namespace n ON n.oid = k.pkgnamespace
  WHERE COALESCE(length('{{package}}'), 0) > 0 AND lower(k.pkgname::text) LIKE lower('%{{package}}%')
  ORDER BY 1, 2, 3, 4
  LIMIT 40;
params:
  - key: name
    type: String
    description: 过程名(模糊匹配)
  - key: package
    type: String
    description: 包名(模糊匹配);空串表示不搜包
