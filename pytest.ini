[pytest]
# 仓库根的 pytest 配置。本仓有四处测试:
#   agent/tests/        技能包(随 gh_skill 同步)
#   docker/tests/       镜像入口与状态同步
#   gateway/tests/      接入网关
#   scripts/k8s/tests/  部署脚本
#
# **importlib 导入模式是必需的,不是偏好。** 默认的 prepend 模式按目录名推导模块名,
# 于是 docker/tests/ 与 scripts/k8s/tests/ 都成了 `tests` 包 —— 分开跑各自都绿,
# 一起跑就 `ModuleNotFoundError: No module named 'tests.test_provision'`
# (2026-09-21 踩到)。结果是没人敢一次跑全,而「一次跑全」正是发版前要做的事。
addopts = --import-mode=importlib

markers =
    live: 需要真实数据库连接的测试(没配就自动跳过)
