# vacuum 规范
- id: GS-VAC-002
  severity: warn
  check: advisory
  rule: 行数少于 10 万的热表按表级调大 autovacuum_vacuum_threshold(本行口径 5 万),不按默认阈值频繁 vacuum
  criteria: pg_stat_user_tables 里 n_live_tup < 10 万且 autovacuum_count 增速高
  keywords:
  - 小表
  - autovacuum 阈值
  - autovacuum_vacuum_threshold
  - 热表
  source: 《运维规范》v5 §6.2
- id: GS-XACT-001
  severity: error
  check: advisory
  rule: 长事务与空闲事务一律经应用运维平台定位并由应用方处理,数据库侧不 kill 业务会话
  criteria: xact_start 超过 8 小时或 idle in transaction 超过 10 分钟
  keywords:
  - 长事务
  - idle in transaction
  - kill
  - XACT_LONG
  - LOCK_ROOT_IDLE_XACT
  source: 《运维规范》v5 §3.4
