# 全量 pg_settings —— 参数体检的唯一数据源。
#
# **为什么取全量、而不是按名字过滤。** 按名字过滤要把参数名列表当参数传进来,
# 而名字列表只能以字符串形式拼进 SQL(`name = ANY(string_to_array('{{names}}', ','))`)——
# 那是一个注入面,而收益只是少传几百行。og5 实测 pg_settings 758 行,
# 一次取回来在 Python 侧比对基线,既没有注入面,也让基线能随时增删而不用改白名单脚本
# (改脚本要客户重新导入,改基线不用)。
#
# 取的列比"名字+值"多几样,每样都有用:
#   unit        —— 归一化必需。shared_buffers 的单位是 8kB、work_mem 是 kB、
#                  statement_timeout 是 ms;不按 unit 归一就会把 4GB 读成 524288。
#   boot_val    —— 内核默认值。判「这个值是客户特意改的,还是从来没动过」要靠它。
#   reset_val   —— reload 之后会变成什么。改了配置文件但没 reload 时,
#                  setting 与 reset_val 会不一致 —— 那本身就是一条该报的发现。
#   context     —— 改这个参数要不要重启(postmaster)。给处置建议时必须说清,
#                  否则 DBA 以为 reload 就行,改完发现没生效。
#   source      —— 值从哪来(default / configuration file / command line)。
#   vartype / min_val / max_val / enumvals —— 判定与呈现时解释取值范围用。
#   category / short_desc —— 报告里分组与解释用,不必再去查文档。
name: config.settings
description: 全量运行参数（含单位、默认值、生效方式），供参数体检比对基线
readonly: true
sql: |
  SELECT name,
         COALESCE(setting,'')    AS setting,
         COALESCE(unit,'')       AS unit,
         COALESCE(vartype,'')    AS vartype,
         COALESCE(boot_val,'')   AS boot_val,
         COALESCE(reset_val,'')  AS reset_val,
         COALESCE(context,'')    AS context,
         COALESCE(source,'')     AS source,
         COALESCE(min_val,'')    AS min_val,
         COALESCE(max_val,'')    AS max_val,
         COALESCE(enumvals::text,'') AS enumvals,
         COALESCE(category,'')   AS category,
         COALESCE(short_desc,'') AS short_desc
    FROM pg_settings
   ORDER BY name;
