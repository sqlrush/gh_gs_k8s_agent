# 运行态计划:gs_get_explain(pid)——GaussDB 私有函数,返回指定后台线程**正在执行**的计划。
#
# 与 explain.plan_text 的本质差别:不执行任何 SQL、不需要 SQL 文本,拿到的是内核里正在走的那个计划
# (估算计划可能因绑定值 / 统计信息 / 计划跳变而与之不同)。
#
# **签名按现场实测写 (bigint),不按文档的 (integer)。** 2026-09-08 客户在 GaussDB Kernel 505.2.1.SPC0600 上查
# pg_catalog:gs_get_explain(bigint) / gs_get_dn_explain(text, bigint) / gs_get_kernel_info(),
# 文档写的 (integer) 已过时。pg_stat_activity.pid 本来就是 64 位线程号(og5 实测 281440978523808),
# 放不进 integer,bigint 才对得上。文档签名是 (integer) 的老内核用同族的 explain.runtime_plan_int4,
# 调用侧(common/kernel_funcs.py)按探测到的签名二选一,签名两者都不是则不调、说明后退回 EXPLAIN。
#
# pid 保持 INTEGER 参数位(中间件侧有数字格式校验,String 位没有——注册器会按注入面告警),SQL 里再显式
# ::bigint。15 位线程号能不能过 INTEGER 校验:现场 sqltune / topsql 一直以 INTEGER 传超过 2^31 的
# unique_sql_id 且正常,说明它按长整型处理;真被拒也是一条看得见的 400,不是静默失效。
#
# 文档前提(任一不满足则返回空,调用方要把空当「没拿到」而不是「计划为空」):
#   track_activities = on;plan_collect_thresh ≠ -1;语句可 EXPLAIN 且计划不含 STREAM 算子;
#   分布式下只看 CN 生成的计划,DN 上的用 gs_get_dn_explain。
# 只在 explain.kernel_funcs 探到该函数存在时调用;openGauss 上没有此函数,不会走到这条。
name: explain.runtime_plan
description: 按后台线程 pid 取运行态执行计划(gs_get_explain(bigint),GaussDB 私有,505.2.1 实测签名;不执行 SQL)
readonly: true
sql: |
  SELECT gs_get_explain({{pid}}::bigint) AS plan;
params:
  - key: pid
    type: INTEGER
    description: 后台线程 pid(pg_stat_activity.pid,64 位线程号);脚本内显式转为 bigint
