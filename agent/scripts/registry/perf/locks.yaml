# granted 升序：未授予的锁（等待中）排在最前，那才是要看的
# M 兼容(v1.5.1,2026-11-20 现场反馈):本脚本切到业务库执行,业务库可能是 M 兼容模式(sql_compatibility='M')。
#   名字类列(name 类型)进 concat / COALESCE 前先 ::text:M 库按自己的类型推导矩阵处理 name 类型,
#   health.table_writes 就栽在 COALESCE(name, name) 上;显式转成文字,两种模式结果一致。
name: perf.locks
database_type: appbusiness
description: 当前锁与持有者（pg_locks 关联 pg_class / pg_stat_activity）
sql: |
  select l.locktype, l.mode, l.granted,
         l.pid::text, l.sessionid::text,
         coalesce(c.relname::text, '-') as relname,
         coalesce(a.usename::text, '-') as usename
  from pg_locks l
  left join pg_class c on c.oid = l.relation
  left join pg_stat_activity a on a.sessionid = l.sessionid
  order by l.granted, l.locktype
  limit {{limit}};
params:
  - key: limit
    type: INTEGER
    description: 返回条数上限
