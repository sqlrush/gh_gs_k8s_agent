# granted 升序：未授予的锁（等待中）排在最前，那才是要看的
name: perf.locks
description: 当前锁与持有者（pg_locks 关联 pg_class / pg_stat_activity）
sql: |
  select l.locktype, l.mode, l.granted,
         l.pid::text, l.sessionid::text,
         coalesce(c.relname, '-') as relname,
         coalesce(a.usename, '-') as usename
  from pg_locks l
  left join pg_class c on c.oid = l.relation
  left join pg_stat_activity a on a.sessionid = l.sessionid
  order by l.granted, l.locktype
  limit {{limit}};
params:
  - key: limit
    type: INTEGER
    description: 返回条数上限
