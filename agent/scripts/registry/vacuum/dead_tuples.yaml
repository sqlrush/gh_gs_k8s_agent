# 死元组清单 —— 触发线（threshold + scale_factor × reltuples）由 python 侧
# 结合 autovac_settings.yaml 的 GUC 现值算，这里只管取数。
#
# last_autovacuum_age_s / last_vacuum_age_s **故意不 COALESCE 成 0**：
# 从没跑过 autovacuum/vacuum 的表，这两列在协议里回来是空串（即 NULL）。
# "0 秒前刚跑过"和"从没跑过"是相反的意思，折成 0 会让最该管的表看起来
# 刚被服务过，掩盖它正是 vacuum_count=0、autovacuum_count=0 的那一类表。
#
# n_tup_upd / n_tup_hot_upd / n_tup_del(2026-11-05 加):死元组是这张表上的 UPDATE / DELETE 留下的,
# 报告要说清「是哪类业务操作造成的」,不能只说「autovacuum 没追上」(站在应用 DBA 角度)。
#
# 系统 schema 排除表照抄 scripts/registry/health/bloat.yaml 的清单，
# 避免系统表的死元组把真正的风险表挤出 LIMIT。
#
# 时间差一律 date_part('epoch', clock_timestamp() - 列)(v1.4.14):本脚本切到业务库执行,业务库可能是 M 兼容模式
# (dbcompatibility='M')—— 那里 now() 返回 datetime,与 timestamptz 列相减后 EXTRACT(EPOCH …) 的结果
# 类型 GaussDB JDBC 驱动不认识,整条报 un support type(2026-11-16 现场反馈与实测)。clock_timestamp() 两种
# 兼容模式下都返回 timestamptz,date_part 返回 double precision,A 兼容(postgres 库、og5)下结果与原写法一致。
# 守卫测试 test_registry_m_compat_units.py:业务库脚本不许再出现 now()。
name: vacuum.dead_tuples
database_type: appbusiness
description: 用户表死元组清单（含存活/死元组数、表大小、autovacuum 服务历史）
readonly: true
sql: |
  SELECT n.nspname AS schema,
         t.relname AS "table",
         t.n_live_tup AS n_live_tup,
         t.n_dead_tup AS n_dead_tup,
         c.reltuples AS reltuples,
         pg_total_relation_size(c.oid) AS table_bytes,
         date_part('epoch', clock_timestamp() - t.last_autovacuum) AS last_autovacuum_age_s,
         date_part('epoch', clock_timestamp() - t.last_vacuum) AS last_vacuum_age_s,
         t.vacuum_count AS vacuum_count,
         t.autovacuum_count AS autovacuum_count,
         t.n_tup_upd AS n_tup_upd,
         t.n_tup_hot_upd AS n_tup_hot_upd,
         t.n_tup_del AS n_tup_del,
         CASE WHEN 'autovacuum_enabled=false' = ANY(c.reloptions) THEN false ELSE true END AS autovac_enabled,
         COALESCE(array_to_string(c.reloptions, ','), '') AS reloptions
    FROM pg_stat_user_tables t
    JOIN pg_class c ON c.oid = t.relid
    JOIN pg_namespace n ON n.oid = c.relnamespace
   WHERE n.nspname NOT IN ('pg_catalog','information_schema','snapshot','dbe_perf','dbe_pldeveloper','cstore')
   ORDER BY t.n_dead_tup DESC
   LIMIT {{limit}};
params:
  - key: limit
    type: INTEGER
    description: 返回条数上限
