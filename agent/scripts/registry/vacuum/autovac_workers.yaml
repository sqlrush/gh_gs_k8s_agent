# 当前正在跑的 autovacuum worker（query 形如 'autovacuum: VACUUM public.t'）。
# 用来判断"autovacuum 是不是压根没追上"还是"追上了、只是还没轮到这张表"。
name: vacuum.autovac_workers
description: 当前正在执行的 autovacuum worker
readonly: true
sql: |
  SELECT pid,
         COALESCE(sessionid,0) AS sessionid,
         EXTRACT(EPOCH FROM (now()-xact_start)) AS xact_age_s,
         COALESCE(query,'') AS query
    FROM pg_stat_activity
   WHERE query LIKE 'autovacuum:%';
