# 慢 SQL 查询。SQL 正文取自 common/sql.py 的 skill_slowsql_001，
# 把 f-string 的 {x} 换成 GRMP 的 {{x}}，其余逐字未动 ——
# 两条执行路径必须跑同一条 SQL，改写就失去了双路径比对的意义。
#
# 注意 begin_time 的引号由脚本作者写（CAST('{{begin_time}}' AS TIMESTAMP)），
# 这是决策表第 5 项定下的约定：中间件只做纯文本替换，不按类型补引号。
name: slowsql.slow_sql
description: 查询平均耗时超阈值的 SQL（dbe_perf.statement）
sql: |
  SELECT
    unique_sql_id::text,
    LEFT(REGEXP_REPLACE(query, '\s+', ' ', 'g'), 180) AS query,
    n_calls AS calls,
    ROUND((total_elapse_time/NULLIF(n_calls,0))/1000::numeric, 2) AS avg_ms,
    ROUND(total_elapse_time/1000000::numeric, 2) AS total_sec,
    ROUND(cpu_time/1000000::numeric, 2) AS cpu_sec,
    n_returned_rows AS rows
  FROM dbe_perf.statement
  WHERE (total_elapse_time/NULLIF(n_calls,0))/1000 > {{threshold_ms}}
    AND n_calls > 0 AND last_updated >= CAST('{{begin_time}}' AS TIMESTAMP)
  ORDER BY total_elapse_time/NULLIF(n_calls,0) DESC
  LIMIT {{limit}};
params:
  - key: threshold_ms
    type: INTEGER
    description: 平均耗时阈值（毫秒），超过该值的语句才返回
  - key: begin_time
    type: DateTime
    description: 统计起点，格式 yyyy-MM-dd HH:mm:ss
  - key: limit
    type: INTEGER
    description: 返回条数上限
