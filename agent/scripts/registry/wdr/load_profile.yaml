# SQL 取自 common/sql.py 的 skill_wdr_001。
# **改动：两个 COALESCE(...) 加了别名 db_time_us / cpu_time_us。**
# 原来两列都叫 coalesce，协议按列名做键，重名列会被后一个覆盖 ——
# DB time 会被 CPU time 顶掉，且不报错。加别名不改语义与结果。
# **2026-10-17 起本脚本已弃用,skill 不再调用它。** 留着只为兼容已下发的白名单
# (删它要客户动 DML,不值得);**不要再拿它算 DB time**。
#
# 原因:它把 DB time 算成 snap_summary_statement 里「两端都在的 sql_id」的耗时增量之和。
# 那张表是滚动的语句历史,内连接会把窗口中途才出现的语句整批丢掉。压测实测 22 分钟窗口
# 算出 2.67 秒,而内核 DB_TIME 增量是 23518 秒 —— 差 8800 倍且不报错。
# 现在 DB time 取 waitevent.instance_time(snap_global_instance_time 的增量)。
name: wdr.load_profile
description: 【已弃用,勿用】窗口内 DB time 与 CPU time 增量(snap_summary_statement,内连接会漏语句)
sql: |
  WITH b AS (SELECT snap_unique_sql_id AS sid, sum(snap_total_elapse_time) AS t, sum(snap_cpu_time) AS c
               FROM snapshot.snap_summary_statement WHERE snapshot_id={{b}} GROUP BY snap_unique_sql_id),
       e AS (SELECT snap_unique_sql_id AS sid, sum(snap_total_elapse_time) AS t, sum(snap_cpu_time) AS c
               FROM snapshot.snap_summary_statement WHERE snapshot_id={{e}} GROUP BY snap_unique_sql_id)
  SELECT COALESCE(SUM(e.t-b.t),0)  AS db_time_us,
         COALESCE(SUM(e.c-b.c),0)  AS cpu_time_us
  FROM e JOIN b USING (sid);
params:
  - key: b
    type: INTEGER
    description: 起始快照 ID
  - key: e
    type: INTEGER
    description: 结束快照 ID
