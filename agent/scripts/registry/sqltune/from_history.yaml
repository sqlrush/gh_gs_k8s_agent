# SQL 取自 common/sql.py 的 skill_sqltune_005，{sid} 换成 {{sid}}，其余未动。
# 列名 schema_name / query 本来就唯一且有意义，未加别名。
#
# 正文与 sqlfetch.from_history 逐字相同（common/sql.py 里 skill_sqltune_005 与
# skill_sqlfetch_001 本来就是两份相同的常量）。**刻意不复用同一个逻辑名**：
# 逻辑名按 skill 分域，客户侧按域审批/作废；共用一条会让「作废 sqlfetch 的
# 脚本」顺手把 sqltune 打断，而这条依赖在任何一侧都看不出来。
name: sqltune.from_history
description: 按 unique_query_id 从 SQL 历史里取最近一条完整语句
sql: |
  SELECT schema_name, query
  FROM dbe_perf.statement_history
  WHERE unique_query_id = {{sid}}
    AND query NOT LIKE '/* missing SQL statement%'
  ORDER BY start_time DESC
  LIMIT 1;
params:
  - key: sid
    type: INTEGER
    description: unique_query_id（整数，可能为负）
